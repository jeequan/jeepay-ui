name: Cashier OAuth regression
on:
  pull_request:
    paths:
      - 'jeepay-ui-cashier/**'
      - '.github/workflows/cashier-oauth.yml'
permissions:
  contents: read
jobs:
  callback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jeepay-ui-cashier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jeepay-ui-cashier/package-lock.json
      - run: npm ci
      - run: npm run test:oauth
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:oauth:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cashier-oauth-browser-results
          path: jeepay-ui-cashier/test-results/
          if-no-files-found: ignore
